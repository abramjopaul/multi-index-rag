[tool.poetry]
name = "multi-index-rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation with Formula-Aware Retrieval"
authors = ["Abram Jopaul <abram.jopaul@uni-koblenz.de>"]
readme = "README.md"
packages = [
    { include = "multirag", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
lxml = ">=4.9.0"
beautifulsoup4 = ">=4.12.0"
tqdm = "^4.67.3"
pyserini = ">=0.22.0"
pyyaml = ">=6.0"
pytrec_eval_terrier = ">=0.5"
wandb = ">=0.15.0"
# GPU users: pip uninstall faiss-cpu && pip install faiss-gpu (mutual exclusion — cannot coexist)
sentence-transformers = "^5.3.0"
transformers = "~4.41"
orjson = "^3.11.7"
gcloud = "^0.18.3"
gensim = ">=4.3.0"
numpy = ">=1.26.0"
matplotlib = ">=3.10.0"
torch = ">=2.0.0"
gcsfs = "^2026.5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "gcloud (>=0.18.3,<0.19.0)"
]
