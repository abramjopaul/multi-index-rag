judge:
  provider: google                 # google | openai_compat
  model: gemini-3.5-flash-lite      # exact version string, never a floating alias.
                                    # gemini-2.0-flash/-001 and gemini-2.5-flash/-lite
                                    # were all retired by Google as of this writing
                                    # (confirmed via live 404s) -- verify availability
                                    # with client.models.list() before changing this.
  temperature: 0.0
  max_tokens: 1024                 # a 0-3 label + short reasoning; keep tight for cost
  top_p: 1.0
  use_openai_compat_endpoint: false
  openai_compat_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key_env: GEMINI_API_KEY

execution:
  mode: batch                      # batch | sync   (batch is the default and the whole point)
  batch_poll_seconds: 60
  # Empirically determined (live API, 2026-07-30): the TPM quota applies cumulatively to
  # chunks submitted back-to-back in a burst, not just per individual chunk -- 2x3,000-pair
  # chunks submitted in immediate succession succeeded (6,000 total), but a 3rd back-to-back
  # submission (pushing the burst to 9,000) failed with 429, even though a single standalone
  # 5,000-pair submission succeeds on its own. Keeping this at 1 means only one chunk
  # submits per script invocation, naturally spacing submissions across separate runs
  # instead of bursting. Only raise after re-confirming headroom empirically.
  batch_max_in_flight: 1
  # Empirically determined (live API, 2026-07-30): 5,000-request batch submissions
  # succeed, 8,000/9,781 fail with 429 RESOURCE_EXHAUSTED (TPM quota, ~4M tokens/min for
  # gemini-3.5-flash-lite on this account). 3,000 leaves comfortable headroom below the
  # ~5,000 boundary -- re-confirm against the current account's quota before raising.
  max_batch_chunk_size: 3000
  sync_max_concurrency: 4          # only used when mode: sync (smoke tests)
  max_retries: 5
  retry_backoff_seconds: 2.0
  request_timeout_seconds: 120

cache:
  dir: .cache/judge
  # cache key = sha256(topic_id | answer_id | prompt_sha256 | judge_model)

prompt:
  template_path: src/multirag/eval/prompts/arqmath_relevance_v1.yaml

wandb:
  enabled: true
  entity: abramjopaul-abram        # same account as the Track B runs
  project: one-last-run            # same project as Track B — keep everything in one place
  group: V                         # NEW group for the validation experiment
  job_type: judge-validation       # distinguishes V runs from future B / C runs
  mode: online                     # online | offline | disabled
  tags: ["V", "judge", "arqmath-1-2-3"]
  # run name convention: "V-<judge_model>-<prompt_version>-<UTC-yyyymmdd-HHMM>"
