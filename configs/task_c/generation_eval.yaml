# Track C generation + evaluation: stable settings shared across every
# config/k in a comparison. Per-invocation knobs (--trec-file, --k, --no-rag,
# --qrels, --max-topics, --topic-ids, --config-name) are CLI arguments to
# experiments/track_c/generate_and_score.py, not here.

generator:
  model: "Qwen/Qwen2.5-3B-Instruct"
  revision: "main"   # TODO: pin to a specific commit hash for reproducibility
  dtype: "bfloat16"
  quantization: null
  # vLLM is broken in this environment: vllm 0.25.0 requires transformers v5,
  # but transformers 4.57.6 is installed (needed elsewhere in the repo, e.g.
  # sentence-transformers). "hf" (HuggingFace transformers, sequential but
  # working) is used until that's reconciled -- see generator.py's
  # HFGenerator, already built for exactly this fallback.
  backend: "hf"
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 512
    seed: 42

prompt_template_version: "v2"   # RAG-only: answer strictly from context, refuse if insufficient

judge:
  model: "gemini-3.5-flash-lite"
  api_key_env: "GEMINI_API_KEY"
  temperature: 0.0
  max_concurrency: 5
  cache_dir: ".cache/track_c_judge"
  metrics:
    - "faithfulness"
    - "factual_correctness_precision"
    - "factual_correctness_recall"

wandb:
  project: "one-last-run"
  group: "Track C : Generation"
  job_type: "track-c-generation"
  tags: ["C", "generation", "arqmath-3"]
