run_name: "c0_1_qwen2.5_7b"
phase: "C0.1"

context_source:
  type: "no_rag"

generator:
  model: "Qwen/Qwen2.5-7B-Instruct"
  revision: "main"   # TODO: pin to specific commit hash after model download
  dtype: "bfloat16"
  quantization: null
  backend: "vllm"
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 512
    seed: 42

prompt_template_version: "v1"

topics_path: "data/processed/topics/topics.jsonl"
qrels_path: "data/raw/qrels/qrel_task1_2022_official.tsv"
answers_path: "data/processed/collection/answers.jsonl"

ground_truth_strategy: "top_scored"

ragas:
  backend: "gemini"
  model: "gemini-flash-lite-latest"
  api_key_env: "GEMINI_API_KEY"
  rpm_limit: 10
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  metrics:
    - "answer_relevance"
    - "answer_correctness"
    - "semantic_similarity"
    - "rouge_l"
  n_repeats: 1

n_topics: null   # null = all topics; use --n-topics 5 for smoke test

experiment_name: "C0.1 No-RAG Headroom"
