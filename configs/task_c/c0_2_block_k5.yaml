# C0.2-block-k5 — REAL retrieval condition for Track C (hierarchical block
# fusion, BM25+Dense+[SLT+OPT+SLT-TYPE], top-5). Companion to c0_2_frozen.yaml
# (no-RAG). Run via experiments/run_c0_3.py to measure RAGAS judge noise for
# faithfulness/context_precision/context_recall — undefined under no-RAG and
# never exercised before this config.
#
# Copied VERBATIM from c0_2_frozen.yaml:
#   generator: (model, revision, dtype, quantization, backend, decoding)
#   ragas: (backend, model, api_key_env, rpm_limit, embedding_model, n_repeats)
#
# Intentionally DIFFERENT from c0_2_frozen.yaml:
#   context_source           - real top-5 block-fusion retrieval, not no_rag.
#   prompt_template_version  - "v2" (RAG-strict: answer ONLY from context, explicit
#                               refusal instruction) instead of v1's open-book
#                               template, which would let the model ignore
#                               context and fall back to parametric knowledge.
#   ragas.metrics             - adds faithfulness/context_precision/context_recall
#                               (undefined without context). This is the ONLY
#                               ragas subfield that deviates from "copy verbatim".
#   ragas.seed                - pins the judge LLM (see comment below); c0_2_frozen.yaml
#                               predates this field and relies on its default (42) too.
#   require_ground_truth      - true (see below); c0_2_frozen.yaml leaves this
#                               at its default False.

run_name: "c0_2_block_k5"
phase: "C0.2"

context_source:
  type: "run_file"
  run_path: "data/runs/task1/fusion/fuse_bm25_dense_formula_fused_block_20260709_rrf.tsv"
  k: 5
  # Real fusion rank order, UNMODIFIED — no relevance filtering, re-ranking, or
  # dropping of non-relevant chunks. Non-relevant retrieved passages are the
  # real operating point this condition measures: an all-relevant (qrels-derived)
  # context would saturate context_precision at 1.0 and pin recall/faithfulness
  # near ceiling, measuring a ceiling artifact instead of real judge noise.
  # That all-relevant condition is C-Oracle's job, not this one. Noise numbers
  # from this run are k=5-specific and should not be assumed to generalize
  # across a future k-sweep (context_precision noise is k-dependent: one
  # flipped chunk moves the score 0.2 at k=5, 1.0 at k=1, 0.05 at k=20).

generator:
  model: "Qwen/Qwen2.5-3B-Instruct"
  revision: "aa8e72537993ba99e69dfaafa59ed015b17504d1"   # pinned main, as of 2024-09-25 (looked up 2026-07-14)
  dtype: "bfloat16"
  quantization: null
  backend: "vllm"
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 512
    seed: 42

prompt_template_version: "v2"   # sha256: 70648ca448a8c5720903590f107e70db1a190f66cfbfab1517f88a478af9eda8

topics_path: "data/processed/topics/topics.jsonl"
qrels_path: "data/raw/qrels/qrel_task1_2022_official.tsv"
answers_path: "data/processed/collection/answers.jsonl"

ground_truth_strategy: "top_scored"

# Filters topics to GT-having ones BEFORE truncating to n_topics (see
# sample_builder.build_generation_samples). Without this, a naive topics[:n]
# can include GT-less topics: verified that A.311 and A.321 (of the first ~22
# topics in file order) have zero qrels rows. Topic selection has no
# randomness either way (pure file-order filter+truncate) — there is nothing
# to random-seed here.
require_ground_truth: true

ragas:
  backend: "gemini"
  model: "gemini-flash-lite-latest"
  api_key_env: "GEMINI_API_KEY"
  rpm_limit: 10
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  metrics:
    - "answer_relevance"
    - "answer_correctness"
    - "semantic_similarity"
    - "rouge_l"
    - "faithfulness"
    - "context_precision"
    - "context_recall"
  n_repeats: 1
  seed: 42   # Pins ChatGoogleGenerativeAI's real Gemini generationConfig.seed
             # (genuinely forwarded, unlike ragas.run_config.RunConfig.seed
             # which is dead code — .rng is never read anywhere in ragas).
             # Judge temperature is ALSO forced to 0.0 unconditionally via a
             # get_temperature() override in ragas_eval.py (not config-driven)
             # — previously the judge ran at temp=0.01 (n=1 calls) or 0.3
             # (answer_relevance's n=3 strictness calls), never actually
             # pinned despite the generator being frozen at temp=0. Note:
             # Gemini documents seed as best-effort reproducibility, not a
             # guarantee.

n_topics: null   # CLI --n-topics 20 overrides this for the mandated run command

experiment_name: "C0.2-block-k5 - real top-5 block fusion retrieval, judge reliability"
